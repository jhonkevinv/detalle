<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores Amarillas para ti</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Georgia','Times New Roman',serif;
    background:linear-gradient(160deg,#fff8e8 0%,#fdeec2 100%);
    color:#5c3a00;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  .card{
    position:relative;
    width:100%;
    max-width:440px;
    background:#fffdf6;
    border-radius:22px;
    padding:38px 30px 40px;
    text-align:center;
    box-shadow:0 20px 50px rgba(140,95,0,0.16);
  }

  .frame{
    position:absolute;
    inset:10px;
    border:1.5px solid #e9c766;
    border-radius:14px;
    pointer-events:none;
  }

  /* --------- Halo tipo acuarela --------- */
  .halo{
    position:absolute;
    top:-40px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:260px;
    background:radial-gradient(circle, rgba(255,211,90,0.45) 0%, rgba(255,211,90,0) 70%);
    filter:blur(6px);
    z-index:0;
  }

  .illustration{
    position:relative;
    z-index:1;
    width:min(70vw,230px);
    margin:6px auto 4px;
  }

  .vase{
    fill:#f3e2b8;
  }
  .vase-shade{
    fill:#e3cd94;
  }

  .bloom-group{
    transform-box:fill-box;
    transform-origin:bottom center;
    opacity:0;
    animation:unfold 1.4s cubic-bezier(.28,1.4,.45,1) forwards;
  }
  .bloom-group.c{ animation-delay:.1s; }
  .bloom-group.l{ animation-delay:.35s; }
  .bloom-group.r{ animation-delay:.6s; }

  @keyframes unfold{
    0%{ opacity:0; transform:scale(0.3) rotate(-6deg) translateY(10px); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scale(1) rotate(0deg) translateY(0); }
  }

  .breathe{
    transform-box:fill-box;
    transform-origin:bottom center;
    animation:breathe 4.5s ease-in-out infinite;
  }
  .bloom-group.l .breathe{ animation-delay:-1.5s; }
  .bloom-group.r .breathe{ animation-delay:-3s; }

  @keyframes breathe{
    0%,100%{ transform:rotate(-1.6deg) scale(1); }
    50%{ transform:rotate(1.6deg) scale(1.015); }
  }

  .glimmer{
    opacity:0;
    animation:glimmer 3s ease-in-out infinite;
  }
  .bloom-group.c .glimmer{ animation-delay:1.6s; }
  .bloom-group.l .glimmer{ animation-delay:2s; }
  .bloom-group.r .glimmer{ animation-delay:2.4s; }

  @keyframes glimmer{
    0%,100%{ opacity:0; transform:scale(0.6); }
    50%{ opacity:0.9; transform:scale(1); }
  }

  .content-reveal{
    position:relative;
    z-index:1;
    opacity:0;
    transform:translateY(14px);
    animation:fadeInUp 1s ease-out 2s forwards;
  }

  @keyframes fadeInUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .divider{
    width:46px;
    height:2px;
    background:#e9c766;
    margin:18px auto 20px;
    border-radius:2px;
  }

  .phrase{
    font-style:italic;
    font-size:1.2rem;
    line-height:1.55;
    margin:0 0 20px;
    color:#6b4300;
  }

  .promise{
    font-size:1rem;
    line-height:1.75;
    opacity:0.92;
  }

  .promise strong{
    color:#a06a00;
  }

  .signature{
    margin-top:26px;
    font-size:0.98rem;
    opacity:0.75;
    letter-spacing:0.3px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="frame"></div>
  <div class="halo"></div>

  <svg class="illustration" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="60%" stop-color="#ffce3d"/>
        <stop offset="100%" stop-color="#f0a300"/>
      </linearGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#8fc25a"/>
        <stop offset="100%" stop-color="#4c8c2b"/>
      </linearGradient>
      <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6fa83f"/>
        <stop offset="100%" stop-color="#38621f"/>
      </linearGradient>
    </defs>

    <!-- Jarrón -->
    <path class="vase" d="M78,196 C74,214 72,228 78,240 C88,250 132,250 142,240 C148,228 146,214 142,196 Z"/>
    <path class="vase-shade" d="M100,196 C98,214 97,228 100,240 L110,240 C108,228 108,214 110,196 Z"/>
    <ellipse cx="110" cy="196" rx="34" ry="7" fill="#e9d8a6"/>

    <!-- Tallos -->
    <path d="M110,198 C104,160 106,118 110,86" fill="none" stroke="url(#stem)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M92,198 C88,168 92,138 100,110" fill="none" stroke="url(#stem)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128,198 C132,168 128,138 120,110" fill="none" stroke="url(#stem)" stroke-width="4" stroke-linecap="round"/>

    <!-- Hojas -->
    <path d="M108,150 C90,148 76,158 68,174 C88,178 104,170 109,160 Z" fill="url(#leaf)"/>
    <path d="M112,160 C130,156 146,164 154,180 C134,184 118,176 112,168 Z" fill="url(#leaf)"/>
    <path d="M98,178 C82,180 70,192 66,208 C84,208 98,198 101,188 Z" fill="url(#leaf)" opacity="0.95"/>

    <!-- Tulipán izquierdo -->
    <g class="bloom-group l">
      <g class="breathe">
        <g transform="translate(100,110)">
          <path d="M0,52 C-19,52 -26,34 -22,18 C-20,7 -10,-1 0,-4 C10,-1 20,7 22,18 C26,34 19,52 0,52 Z" fill="url(#petal)"/>
          <path d="M0,52 C-11,50 -16,36 -13,20 C-12,10 -5,2 0,0 C-1,15 -2,36 0,52 Z" fill="#fff8de" opacity="0.55"/>
          <circle class="glimmer" cx="-15" cy="8" r="2.4" fill="#fffbe8"/>
        </g>
      </g>
    </g>

    <!-- Tulipán central -->
    <g class="bloom-group c">
      <g class="breathe">
        <g transform="translate(110,86)">
          <path d="M0,58 C-21,58 -29,38 -25,20 C-22,8 -11,-1 0,-5 C11,-1 22,8 25,20 C29,38 21,58 0,58 Z" fill="url(#petal)"/>
          <path d="M0,58 C-12,56 -18,40 -15,22 C-13,11 -6,2 0,0 C-1,17 -2,40 0,58 Z" fill="#fff8de" opacity="0.6"/>
          <circle class="glimmer" cx="18" cy="10" r="2.8" fill="#fffbe8"/>
          <circle class="glimmer" cx="-14" cy="24" r="2" fill="#fffbe8"/>
        </g>
      </g>
    </g>

    <!-- Tulipán derecho -->
    <g class="bloom-group r">
      <g class="breathe">
        <g transform="translate(120,110)">
          <path d="M0,52 C-19,52 -26,34 -22,18 C-20,7 -10,-1 0,-4 C10,-1 20,7 22,18 C26,34 19,52 0,52 Z" fill="url(#petal)"/>
          <path d="M0,52 C11,50 16,36 13,20 C12,10 5,2 0,0 C1,15 2,36 0,52 Z" fill="#fff8de" opacity="0.5"/>
          <circle class="glimmer" cx="16" cy="14" r="2.2" fill="#fffbe8"/>
        </g>
      </g>
    </g>
  </svg>

  <div class="content-reveal">
    <div class="divider"></div>
    <p class="phrase">
      "Un pequeño detalle para la flor más bonita."
    </p>

    <p class="promise">
      Hoy es el Día de las Flores Amarillas, y aunque estas sean virtuales,
      quiero que sepas que <strong>son simbólicas para mí</strong>.<br><br>
      Te prometo que en algún momento las cambiaré por unas reales. 🌷
    </p>

    <p class="signature">Atte: Jhon :3</p>
  </div>
</div>

</body>
</html>
